server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/auth/    { proxy_pass http://auth:8000/; }
    location /api/product/ { proxy_pass http://product:8000/; }
    location /api/order/   { proxy_pass http://order:8000/; }
    location /api/payment/ { proxy_pass http://payment:8000/; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}